# Shared centering dispatcher. The callback filters the constructor return
# address before scaling. The original function then
# centers the enlarged root against the active screen.
[[hooks]]
address = 0x0040A600
type = "detour"
function = "scaleCenteredPopup"
original_bytes = [0x8B, 0x51, 0x0C, 0x56, 0x8B, 0x71, 0x18]
