# Menu map icon material setup.
#
# CSWGuiMapHider constructor starts at 0x00693F60. It creates the arrow,
# party-circle, and target-marker materials with hardcoded 32/16/20 sizes.
# Patch those immediates before the constructor reaches material creation.
[[hooks]]
address = 0x00693F60
type = "detour"
function = "prepareMenuMapIconMaterials"
original_bytes = [0x6A, 0xFF, 0x68, 0xC2, 0x03, 0x73, 0x00, 0x64, 0xA1, 0x00, 0x00, 0x00, 0x00]
exclude_from_restore = []

# Menu map scale setup.
#
# CSWGuiInGameMap::OnPanelAdded starts at 0x00693650. It loads the current area
# texture, attaches it to LBL_Map, and refreshes map marker state before draw.
[[hooks]]
address = 0x00693650
type = "detour"
function = "prepareMenuMapScale"
original_bytes = [0x6A, 0xFF, 0x68, 0x20, 0x03, 0x73, 0x00, 0x64, 0xA1, 0x00, 0x00, 0x00, 0x00]
exclude_from_restore = []

[[hooks.parameters]]
source = "ecx"
type = "pointer"

# Area map coordinate preparation.
#
# The marker plotting path uses the shared area-map coordinate bounds. Patch
# those bounds before marker plotting so first-load marker coordinates are
# generated in the same scaled coordinate space as later loads.
[[hooks]]
address = 0x004B4E80
type = "detour"
function = "prepareAreaMapDimensionsForScreen"
original_bytes = [0x51, 0xA1, 0xFC, 0x39, 0x7A, 0x00]
exclude_from_restore = []

