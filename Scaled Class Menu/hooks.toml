# FUN_006DC030 owns the native class-card hover animation. Present canonical
# 800x600 card rects to the routine at entry, let it run unchanged, then map
# its completed rects to the current UI canvas once at the common exit.
[[hooks]]
address = 0x006DC030
type = "detour"
function = "prepareClassSelectionLayout"
original_bytes = [0x83, 0xEC, 0x2C, 0x53, 0x33, 0xC0]
exclude_from_restore = []

[[hooks.parameters]]
source = "ecx"
type = "pointer"

[[hooks]]
address = 0x006DC30A
type = "detour"
function = "finishClassSelectionLayout"
original_bytes = [0x8B, 0x4C, 0x24, 0x40, 0x51, 0x8B, 0x4C, 0x24, 0x18]
exclude_from_restore = []

[[hooks.parameters]]
source = "esp+20"
type = "pointer"

# Constructor end, after StopLoadFromLayout and FUN_0040A630. This fixes the
# first visible placement before the runtime layout path runs.
[[hooks]]
address = 0x006DCDCE
type = "detour"
function = "patchInitialClassSelectionRects"
original_bytes = [0x8B, 0x4D, 0x0C, 0x51, 0x8D, 0x8B, 0x58, 0x15, 0x00, 0x00]
exclude_from_restore = []

[[hooks.parameters]]
source = "ebx"
type = "pointer"
