# Resolution validation fix: FUN_005F0C60 normally accepts only stock 4:3 modes.
[[hooks]]
address = 0x005F0C60
type = "simple"
original_bytes = [
    0x8B, 0x44, 0x24, 0x04,
    0x3D, 0x20, 0x03, 0x00, 0x00
]
replacement_bytes = [
    0xB8, 0x01, 0x00, 0x00, 0x00,
    0xC2, 0x08, 0x00, 0x00
]

# GUI constructor fallback constants: force unsupported sizes through the 800x600 asset path.
[[hooks]]
address = 0x0068C4E3
type = "simple"
original_bytes = [0x00, 0x04, 0x00, 0x00]
replacement_bytes = [0x00, 0x00, 0x00, 0x00]

[[hooks]]
address = 0x0068C4F3
type = "simple"
original_bytes = [0x00, 0x05, 0x00, 0x00]
replacement_bytes = [0x00, 0x00, 0x00, 0x00]

[[hooks]]
address = 0x0068C4FA
type = "simple"
