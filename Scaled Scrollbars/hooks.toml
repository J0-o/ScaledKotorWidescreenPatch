# Listbox SetExtent is about to load the scrollbar child width from +0x110.
# Replace any nonzero template width with the shared scale of the 16px
# 640x480-base value, then let the original load instructions run.
[[hooks]]
address = 0x0041BF8B
type = "detour"
function = "scaleScrollbarWidth"
original_bytes = [0x8B, 0x9E, 0x10, 0x01, 0x00, 0x00, 0x8B, 0xD0, 0x57]
exclude_from_restore = []

[[hooks.parameters]]
source = "esi"
type = "pointer"

# CSWGuiScrollBar::SetExtent has just queried the native arrow texture size.
# Scale that temporary extent before the stock layout code uses it for both
# arrow placement and the remaining scrollbar track.
[[hooks]]
address = 0x0041942F
type = "detour"
function = "scaleScrollbarArrowExtent"
original_bytes = [0x8B, 0x4E, 0x10, 0x8B, 0x7E, 0x0C, 0x33, 0xC0]
exclude_from_restore = []

[[hooks.parameters]]
source = "esp+32"
type = "pointer"
