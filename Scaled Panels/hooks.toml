# QORCPNL, QUICKPNL, LEVELUPPNL, and CUSTPNL are small independent root panels, not
# children of the main character/level-up panel roots. MenuScale intentionally
# ignores small roots, so scale each panel after its constructor's final native
# setup call has completed.
[[hooks]]
address = 0x006F0D0E
type = "detour"
function = "scaleQuickOrCustomPanel"
original_bytes = [0x8B, 0x46, 0x44, 0x8B, 0x4C, 0x24, 0x24]
exclude_from_restore = []

[[hooks.parameters]]
source = "esi"
type = "pointer"

[[hooks]]
address = 0x006EFAE9
type = "detour"
function = "scaleCustomPanel"
original_bytes = [0x8B, 0x46, 0x44, 0x83, 0xC8, 0x60]
exclude_from_restore = []

[[hooks.parameters]]
source = "esi"
type = "pointer"

[[hooks]]
address = 0x006EEE46
type = "detour"
function = "scaleLevelUpPanel"
original_bytes = [0x8D, 0x4C, 0x24, 0x38, 0xC6, 0x44, 0x24, 0x4C, 0x06]
exclude_from_restore = []

[[hooks.parameters]]
source = "esi"
type = "pointer"

[[hooks]]
address = 0x006F06B2
type = "detour"
function = "scaleQuickPanel"
original_bytes = [0x8B, 0x46, 0x44, 0x83, 0xC8, 0x60]
exclude_from_restore = []

[[hooks.parameters]]
source = "esi"
type = "pointer"
