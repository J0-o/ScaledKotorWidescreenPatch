[menu]
name = "Scaled Kotor"
description = "Expands supported resolutions and scales all Menus/HUD."

# Manifest id of the patch that owns this menu.
# Default `patch` for every option below, and how their functions get resolved.
patch = "scaled-kotor"

[[options]]
name = "Text Size"

# slider will provide an integer between min and max.
# The game's slider control has no minimum -- it runs 0..(max - min) internally,
# and `min` is added back on before the value is stored. `min` may therefore be
# negative, which the control on its own could not represent.
type = "slider"
min = 10
max = 15

default = 12

ini = "ScaledKotor.ini"
category = "Scaled Kotor"
key = "ScaleFactor"
description = "Controls how text and some UI elements are scaled."

[[options]]
name = "HUD Size"
type = "slider"
min = 5
max = 20
default = 10
ini = "ScaledKotor.ini"
category = "Scaled Kotor"
key = "HudScaleFactor"
description = "Adjusts HUD size."

[[options]]
name = "Stretched Loading Screens"
type = "toggle"
default = 0
ini = "ScaledKotor.ini"
category = "Scaled Kotor"
key = "StretchLoadingScreens"
function = "reloadStretchLoadingScreens"
description = "Stretches loading-screen textures to fill the full display instead of preserving their aspect ratio and side borders."

[[options]]
name = "Apply Changes"
type = "button"
key = "ScaleFactor"
function = "reloadScaleFactor"
description = "Refreshes Scaled Kotor to reflect changes."
