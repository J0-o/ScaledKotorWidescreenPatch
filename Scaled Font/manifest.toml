[patch]
id = "font-scale-2x-v1"
name = "Scaled Font"
version = "2.5.7"
author = "J"
description = "Loads Override\\ui.ttf and Override\\body.ttf, crops TTF line cells two pixels vertically and the UI font one pixel per horizontal side, renders UI/dialogue and descriptions at 16px, corrects engine wrap-width rounding with a fixed 0.5px safety margin, then applies resolution scaling and Scaled Kotor's global ScaleFactor."

requires = ["scaled-kotor"]

