# Observe complete TXI metadata and install a supported logical font.
# EDI is the texture; font_info and the resource name use GameAPI offsets.
[[hooks]]
address = 0x00422CC1
type = "detour"
function = "onFontTextureMetadataLoaded"
original_bytes = [0x8B, 0x8C, 0x24, 0x14, 0x20, 0x00, 0x00]

[[hooks.parameters]]
source = "edi"
type = "pointer"

# CAurTextureBasic destructor: remove the font-info association before KOTOR
# destroys the texture object. Offsets remain version-dependent GameAPI data.
[[hooks]]
address = 0x00422F40
type = "detour"
function = "forgetMsdfTextureFont"
original_bytes = [0x6A, 0xFF, 0x68, 0x78, 0x57, 0x71, 0x00, 0x64, 0xA1, 0x00, 0x00, 0x00, 0x00]

[[hooks.parameters]]
source = "ecx"
type = "pointer"

# CSWGuiTextParams::SetFontRename (called by UpdateAllFonts). During our refresh,
# rewrap even when the resource name is unchanged. The text-object offset and
# CSWGuiText::wrapText are resolved through GameAPI.
[[hooks]]
address = 0x00415D60
type = "detour"
function = "rewrapResetGuiFont"
original_bytes = [0x83, 0xEC, 0x38, 0x56, 0x8B, 0xF1]

[[hooks.parameters]]
source = "ecx"
type = "pointer"

# CAurFont::TextOutA common epilogue. This closes the first batch when its
# native early branch bypasses the normal end hook; otherwise it is a no-op.
[[hooks]]
address = 0x004A21A4
type = "detour"
function = "endMsdfTextBatch"
original_bytes = [0x8B, 0x8C, 0x24, 0xF8, 0x00, 0x00, 0x00]

# CAurGUIStringInternal::Draw: KOTOR has bound the font texture but has not yet
# entered glBegin(GL_QUADS). Activate the selected atlas shader for this batch.
[[hooks]]
address = 0x0045AA1D
type = "detour"
function = "beginMsdfGuiText"
original_bytes = [0xA1, 0x4C, 0xF3, 0x73, 0x00]

[[hooks.parameters]]
source = "esi"
type = "pointer"

# Same function, immediately after the matching glEnd call.
[[hooks]]
address = 0x0045B1DB
type = "detour"
function = "endMsdfTextBatch"
original_bytes = [0x8B, 0x15, 0x5C, 0xD4, 0x78, 0x00]

# KPM copies stolen instructions verbatim and does not relocate relative calls
# or branches, so these detours use the absolute MOVs around each native batch.
# Primary CAurFont pointers live in the indicated original game-stack slots;
# KPM passes esp+N as the address of that slot.

[[hooks]]
address = 0x004A1920
type = "detour"
function = "beginMsdfPrimaryTextBatch"
original_bytes = [0x8B, 0x15, 0x24, 0x05, 0x83, 0x00]

[[hooks.parameters]]
source = "esp+24"
type = "pointer"

[[hooks]]
address = 0x004A1937
type = "detour"
function = "endMsdfTextBatch"
original_bytes = [0xA1, 0x24, 0x05, 0x83, 0x00]

[[hooks]]
address = 0x004A1ADE
type = "detour"
function = "beginMsdfInlineTextBatch"
original_bytes = [0x8B, 0x15, 0x24, 0x05, 0x83, 0x00]

[[hooks.parameters]]
source = "edi"
type = "pointer"

[[hooks]]
address = 0x004A1AED
type = "detour"
function = "endMsdfTextBatch"
original_bytes = [0xA1, 0x24, 0x05, 0x83, 0x00]

[[hooks]]
address = 0x004A1E1F
type = "detour"
function = "beginMsdfInlineTextBatch"
original_bytes = [0x8B, 0x0D, 0x24, 0x05, 0x83, 0x00]

[[hooks.parameters]]
source = "edi"
type = "pointer"

# Both the third and fourth inline batch paths converge on this absolute MOV.
[[hooks]]
address = 0x004A1E3C
type = "detour"
function = "endMsdfTextBatch"
original_bytes = [0x8B, 0x15, 0x24, 0x05, 0x83, 0x00]

[[hooks]]
address = 0x004A1E7D
type = "detour"
function = "beginMsdfInlineTextBatch"
original_bytes = [0x8B, 0x15, 0x24, 0x05, 0x83, 0x00]

[[hooks.parameters]]
source = "edi"
type = "pointer"

[[hooks]]
address = 0x004A2184
type = "detour"
function = "beginMsdfPrimaryTextBatch"
original_bytes = [0x8B, 0x0D, 0x24, 0x05, 0x83, 0x00]

[[hooks.parameters]]
source = "esp+24"
type = "pointer"

[[hooks]]
address = 0x004A2193
type = "detour"
function = "endMsdfTextBatch"
original_bytes = [0x8B, 0x84, 0x24, 0x0C, 0x01, 0x00, 0x00]

