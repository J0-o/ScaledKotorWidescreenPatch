# 2.2.8: correct native line production and consumption.
# The old scan-to-NUL remainder workaround is removed. Native source pointers,
# line counts, widths and allocation ownership remain under KOTOR's control.
# The operative machine-code replacements are declared below.

# Split the fitting prefix; a too-wide glyph occupies one line, never the entire remainder.
[[hooks]]
address = 0x0045A5E0
type = "replace"
original_bytes = [0x8B, 0x46, 0x14, 0x4B, 0x3B, 0xD8, 0x89, 0x4C, 0x24, 0x10, 0x0F, 0x84, 0x44, 0x02, 0x00, 0x00]
