# Feat group constructor height.
[[hooks]]
address = 0x006CD8D5
type = "detour"
function = "setFeatGroupRowHeight"
original_bytes = [0xC7, 0x44, 0x24, 0x24, 0x28, 0x00, 0x00, 0x00]
skip_original_bytes = true
exclude_from_restore = []

[[hooks.parameters]]
source = "esp+36"
type = "pointer"

# Feat/power group layout finishes by copying the incoming height into the
# stored row extent. Replace only that final six-byte height copy with the
# current Scaled Kotor value; all left, top, and width handling remains native.
[[hooks]]
address = 0x006CCFBC
type = "detour"
function = "setFeatStoredHeight"
original_bytes = [0x8B, 0x4E, 0x0C, 0x89, 0x4F, 0x0C]
skip_original_bytes = true
exclude_from_restore = []

[[hooks.parameters]]
source = "edi"
type = "pointer"

# Variable-height list layout adds a row count to the row height, then stores
# that inflated extent back into reusable rows. Remove the addition so repeated
# Powers/Feats population cannot feed a larger height into the next pass.
[[hooks]]
address = 0x0041B507
type = "simple"
original_bytes = [0x03, 0xEA]
replacement_bytes = [0x90, 0x90]

# Do not add another pixel to the first remainder rows. That value is likewise
# written back into the controls and otherwise re-enters the next layout pass.
[[hooks]]
address = 0x0041B52C
type = "simple"
original_bytes = [0x8D, 0x55, 0x01]
replacement_bytes = [0x8D, 0x55, 0x00]

# Generic composite rows copy the incoming height into the child-layout rect.
# Replace only that six-byte copy; the following ECX stack load remains native.
[[hooks]]
address = 0x00417992
type = "detour"
function = "setGenericListRowHeight"
original_bytes = [0x8B, 0x40, 0x0C, 0x89, 0x41, 0x0C]
skip_original_bytes = true
exclude_from_restore = []

[[hooks.parameters]]
source = "eax"
type = "pointer"

[[hooks.parameters]]
source = "ecx"
type = "pointer"

# Use the scaled icon border for feat/power hit testing.
[[hooks]]
address = 0x006CD1E9
type = "replace"
original_bytes = [0x8B, 0xDE, 0x8B, 0x03, 0x3B, 0xE8]
replacement_bytes = [0x8D, 0x5E, 0x74, 0x8B, 0x03, 0x3B, 0xE8]

# Clear the natural-size clamp for feat icon and arrow labels.
[[hooks]]
address = 0x006CCD7E
type = "simple"
original_bytes = [0x6A, 0x01]
replacement_bytes = [0x6A, 0x00]

[[hooks]]
address = 0x006CCDC1
type = "simple"
original_bytes = [0x6A, 0x01]
replacement_bytes = [0x6A, 0x00]
