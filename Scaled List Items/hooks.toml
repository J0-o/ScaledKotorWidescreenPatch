# Inventory item-entry constructor row height. The callback writes either the
# vanilla value below 1080p or the adjusted 2x value, then patches the shared
# item-entry visual constants before SetExtent runs.
[[hooks]]
address = 0x006B4FA5
type = "detour"
function = "setInventoryItemRowHeight"
original_bytes = [0xC7, 0x44, 0x24, 0x1C, 0x38, 0x00, 0x00, 0x00]
skip_original_bytes = true
exclude_from_restore = []

[[hooks.parameters]]
source = "esi"
type = "pointer"

[[hooks.parameters]]
source = "esp+28"
type = "pointer"

# Store inventory/shop item-entry constructor sibling.
[[hooks]]
address = 0x006B55DF
type = "detour"
function = "setInventoryItemRowHeight"
original_bytes = [0xC7, 0x44, 0x24, 0x18, 0x38, 0x00, 0x00, 0x00]
skip_original_bytes = true
exclude_from_restore = []

[[hooks.parameters]]
source = "esi"
type = "pointer"

[[hooks.parameters]]
source = "esp+24"
type = "pointer"

# Skill-entry constructor row height and shared visual height.
[[hooks]]
address = 0x006ACB1C
type = "detour"
function = "setSkillItemRowHeight"
original_bytes = [0xC7, 0x44, 0x24, 0x18, 0x2A, 0x00, 0x00, 0x00]
